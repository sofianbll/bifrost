<tspan x="800.0" dy="28.75">/mcp/&lt;client&gt;  •  /mcp/&lt;virtual-mcp&gt;  •  /mcp</tspan>
<tspan x="800.0" dy="28.75">Source dédiée  •  bundle autorisé  •  union des droits</tspan>
</text>
