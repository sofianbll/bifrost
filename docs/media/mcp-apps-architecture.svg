<tspan x="1280" dy="0">tools/call</tspan>
<tspan x="1280" dy="27.5">resources/read</tspan>
</text>
<polyline points="455,660 410,660 410,745 200,745 200,705" fill="none" stroke="#15803d" stroke-width="2" marker-end="url(#arrow)"/>
<text id="num2" x="280" y="730.25" font-family="Arial, sans-serif" font-size="25" fill="#15803d" text-anchor="start" dominant-baseline="middle">
<tspan x="280" dy="0">2</tspan>
</text>
<polyline points="335,590 390,590 390,430 455,430" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="9 6"/>
<text id="num3" x="365" y="502.25" font-family="Arial, sans-serif" font-size="25" fill="#1d4ed8" text-anchor="start" dominant-baseline="middle">
