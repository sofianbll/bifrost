<tspan x="200.0" dy="0">Agent + client MCP</tspan>
<tspan x="200.0" dy="31.25">Codex, par exemple</tspan>
</text>
<rect id="frame" x="65" y="555" width="270" height="150" rx="12" fill="#b2f2bb" stroke="#334155" stroke-width="1.5"/>
<text id="frame-label" data-container="frame" x="200.0" y="600.0" font-family="Arial, sans-serif" font-size="24" fill="#334155" text-anchor="middle" dominant-baseline="middle">
<tspan x="200.0" dy="0">App interactive</tspan>
<tspan x="200.0" dy="30.0">iframe isolée</tspan>
<tspan x="200.0" dy="30.0">Gérée par l’hôte</tspan>
</text>
