<tspan x="1400.0" dy="30.0">Excalidraw, PDF,</tspan>
<tspan x="1400.0" dy="30.0">Debug, Monitor…</tspan>
</text>
<rect id="html" x="1265" y="550" width="270" height="155" rx="12" fill="#c3fae8" stroke="#334155" stroke-width="1.5"/>
<text id="html-label" data-container="html" x="1400.0" y="596.25" font-family="Arial, sans-serif" font-size="25" fill="#334155" text-anchor="middle" dominant-baseline="middle">
<tspan x="1400.0" dy="0">Ressources UI</tspan>
<tspan x="1400.0" dy="31.25">HTML de l’App</tspan>
<tspan x="1400.0" dy="31.25">ui://…</tspan>
</text>
<polyline points="1025,550 1025,520 1205,520 1205,325 1265,325" fill="none" stroke="#15803d" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<polyline points="1145,650 1265,650" fill="none" stroke="#15803d" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
