<tspan x="200.0" dy="28.75">Au démarrage :</tspan>
<tspan x="200.0" dy="28.75">clients MCP → clés</tspan>
<tspan x="200.0" dy="28.75">→ liens Virtual MCP</tspan>
</text>
<rect id="invariants" x="1240" y="815" width="320" height="175" rx="12" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
<text id="invariants-label" data-container="invariants" x="1400.0" y="861.25" font-family="Arial, sans-serif" font-size="22" fill="#334155" text-anchor="middle" dominant-baseline="middle">
<tspan x="1400.0" dy="0">Contrat préservé</tspan>
<tspan x="1400.0" dy="27.5">content • structuredContent</tspan>
<tspan x="1400.0" dy="27.5">_meta • isError</tspan>
<tspan x="1400.0" dy="27.5">Alias ambigu : refus</tspan>
</text>
<text id="legend1" x="45" y="1045.6" font-family="Arial, sans-serif" font-size="24" fill="#334155" text-anchor="start" dominant-baseline="middle">
<tspan x="45" dy="0">1  Découverte et appels natifs : initialize, tools/list, tools/call, resources/read.</tspan>
</text>
<text id="legend2" x="45" y="1085.6" font-family="Arial, sans-serif" font-size="24" fill="#334155" text-anchor="start" dominant-baseline="middle">
<tspan x="45" dy="0">2  Résultats et HTML reviennent à l’hôte.   3  Les callbacks repassent par les permissions.</tspan>
</text>
<text id="legend3" x="45" y="1125.6" font-family="Arial, sans-serif" font-size="24" fill="#334155" text-anchor="start" dominant-baseline="middle">
<tspan x="45" dy="0">4  Code Mode est une voie distincte ; les outils Apps restent appelables nativement.</tspan>
</text>
<text id="footer" x="45" y="1168.65" font-family="Arial, sans-serif" font-size="21" fill="#64748b" text-anchor="start" dominant-baseline="middle">
<tspan x="45" dy="0">Périmètre : intégration MCP Apps du fork. Le rendu, la CSP et les vues appartiennent à l’hôte.</tspan>
</text>
</svg>
