<tspan x="650.0" dy="0">Relais MCP Apps natif</tspan>
<tspan x="650.0" dy="31.25">Métadonnées UI + alias</tspan>
<tspan x="650.0" dy="31.25">URI par source + résultats</tspan>
</text>
<polyline points="650,490 650,550" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
