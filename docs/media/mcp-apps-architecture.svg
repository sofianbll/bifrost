<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
<title id="title">Bifrost MCP Apps — architecture de l’intégration</title>
<desc id="desc">L’hôte MCP Apps échange avec Bifrost, qui contrôle les permissions et relaie les appels et ressources vers les serveurs MCP. Code Mode est une voie distincte.</desc>
<rect width="1600" height="1200" fill="white"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs>
<text id="title" x="45" y="53.400000000000006" font-family="Arial, sans-serif" font-size="36" fill="#0f172a" text-anchor="start" dominant-baseline="middle">
<tspan x="45" dy="0">Bifrost MCP Apps — architecture de l’intégration</tspan>
</text>
<text id="subtitle" x="45" y="98.6" font-family="Arial, sans-serif" font-size="24" fill="#334155" text-anchor="start" dominant-baseline="middle">
<tspan x="45" dy="0">Vue des composants • appels natifs, ressources UI, permissions et Code Mode</tspan>
</text>
<rect id="host-zone" x="40" y="135" width="320" height="640" rx="12" fill="#eff6ff" stroke="#334155" stroke-width="1.5"/>
<text id="host-heading" x="65" y="174.25" font-family="Arial, sans-serif" font-size="25" fill="#1d4ed8" text-anchor="start" dominant-baseline="middle">
