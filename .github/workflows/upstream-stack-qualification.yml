name: MCP stack source qualification

on:
  push:
    branches: [codex/spec21-integration]
  workflow_dispatch:
    inputs:
      comparison_mode:
        description: "Characterize the pinned stock result, or require a passing candidate"
        required: true
        type: choice
        options:
          - characterize
          - strict
        default: characterize

permissions:
  contents: read

concurrency:
  group: mcp-stack-qualification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    name: MCP stack source qualification (${{ matrix.name }})
    if: github.repository == 'sofianbll/bifrost' && github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: integration
            product_pin: integration
            fixture_scopes: mcp-apps,codemode-errors
            comparison_mode: characterize
            extra_firstboot: true
            reference_host: false
            output_schema_probe: false
          - name: issue-24
            product_pin: 1194291f60bf0894d8b0998e2725b583bfdf1b5c
            fixture_scopes: firstboot-grants-standalone
            comparison_mode: strict
            extra_firstboot: false
            reference_host: false
            output_schema_probe: false
          - name: issue-25
            product_pin: a7816bd1829d97939fd2c4f73da6aec158a271aa
            fixture_scopes: mcp-apps
            comparison_mode: characterize
            extra_firstboot: false
            reference_host: true
            output_schema_probe: true
    env:
      STOCK_SOURCE: 83258b776c68e1e3d2c1ca0d08a31c2e5811344f
      STABLE_REFERENCE: 9237ec06672406e437b3cb33fc793ffd0403b3ae
      DRIVER_SOURCE: ${{ github.sha }}
      CANDIDATE_SOURCE: ${{ matrix.product_pin == 'integration' && github.sha || matrix.product_pin }}
      FIXTURE_SCOPES: ${{ matrix.fixture_scopes }}
      COMPARISON_MODE: ${{ matrix.name == 'integration' && (inputs.comparison_mode || 'characterize') || matrix.comparison_mode }}
    steps:
      - name: Checkout pinned stock source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.STOCK_SOURCE }}
          path: stock
          persist-credentials: false
      - name: Checkout immutable candidate source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.CANDIDATE_SOURCE }}
          path: candidate
          persist-credentials: false
      - name: Checkout immutable harness source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.DRIVER_SOURCE }}
          path: driver
          persist-credentials: false
      - name: Verify exact source identities
        run: |
          export REPORT_DIR="$RUNNER_TEMP/mcp-stack-${{ matrix.name }}"
          echo "REPORT_DIR=$REPORT_DIR" >> "$GITHUB_ENV"
          test "$(git -C stock rev-parse HEAD)" = "$STOCK_SOURCE"
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_SOURCE"
          test "$(git -C driver rev-parse HEAD)" = "$DRIVER_SOURCE"
          test "$(git -C stock status --porcelain --untracked-files=no)" = ''
          test "$(git -C candidate status --porcelain --untracked-files=no)" = ''
          test "$(git -C driver status --porcelain --untracked-files=no)" = ''
          test ! -f candidate/.env
          test ! -f driver/.env
          mkdir -p "$REPORT_DIR"
          cat > "$REPORT_DIR/source-identities.json" <<EOF
          {
            "stock_source": "$STOCK_SOURCE",
            "candidate_source": "$CANDIDATE_SOURCE",
            "harness_source": "$DRIVER_SOURCE",
            "stable_release_reference": "$STABLE_REFERENCE",
            "fixture_scopes": "$FIXTURE_SCOPES",
            "candidate_tracked_status": "clean",
            "harness_tracked_status": "clean",
            "comparison_mode": "$COMPARISON_MODE"
          }
          EOF
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: "1.27.2"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "25"
      - name: Install the existing API harness dependencies
        run: npm ci --prefix driver/tests/e2e
      - name: Bootstrap the pinned MCP Apps reference host
        if: matrix.reference_host == true
        working-directory: driver
        env:
          MATRIX_NAME: ${{ matrix.name }}
        run: |
          HOST_DIRECTORY="$RUNNER_TEMP/mcpapps-reference-host-${GITHUB_RUN_ID}-${MATRIX_NAME}"
          test ! -e "$HOST_DIRECTORY"
          node tests/mcpapps/bootstrap-reference-host.mjs --directory "$HOST_DIRECTORY"
          "$HOST_DIRECTORY/node_modules/.bin/playwright" install chromium
          echo "REFERENCE_HOST_DIRECTORY=$HOST_DIRECTORY" >> "$GITHUB_ENV"
          cp "$HOST_DIRECTORY/.bifrost-reference-host.json" "$REPORT_DIR/reference-host-bootstrap-manifest.json"
      - uses: step-security/setup-buildx-action@f931205d68723ad9589fd2a7e2ece238bf9de341 # v4.0.0
      - name: Build pinned stock image with its local modules
        id: build-stock
        uses: step-security/docker-build-push-action@846549baaf047e867d038826129a64d81df0f704 # v7.1.0
        with:
          context: stock
          file: stock/transports/Dockerfile.local
          platforms: linux/amd64
          load: true
          tags: bifrost:stock-${{ matrix.name }}-${{ github.run_id }}
          build-args: DYNAMIC=1
      - name: Build pinned product image with its local modules
        id: build-candidate
        uses: step-security/docker-build-push-action@846549baaf047e867d038826129a64d81df0f704 # v7.1.0
        with:
          context: candidate
          file: candidate/transports/Dockerfile.local
          platforms: linux/amd64
          load: true
          tags: bifrost:candidate-${{ matrix.name }}-${{ github.run_id }}
          build-args: DYNAMIC=1
      - name: Record compiled module and image identities
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path

          report_dir = Path(os.environ['REPORT_DIR'])
          builds = [
              ('stock', 'stock', f"bifrost:stock-{os.environ['MATRIX_NAME']}-{os.environ['GITHUB_RUN_ID']}", os.environ['STOCK_SOURCE']),
              ('candidate', 'candidate', f"bifrost:candidate-{os.environ['MATRIX_NAME']}-{os.environ['GITHUB_RUN_ID']}", os.environ['CANDIDATE_SOURCE']),
          ]
          required_modules = {
              'github.com/maximhq/bifrost/transports/v2',
              'github.com/maximhq/bifrost/core',
              'github.com/maximhq/bifrost/framework',
              'github.com/maximhq/bifrost/plugins/governance',
          }
          for name, checkout, image, source in builds:
              git = lambda *args: subprocess.check_output(['git', '-C', checkout, *args], text=True).strip()
              assert git('rev-parse', 'HEAD') == source, f'{name} checkout changed'
              assert git('status', '--porcelain', '--untracked-files=no') == '', f'{name} tracked files changed'
              image_id = subprocess.check_output(['docker', 'image', 'inspect', '--format', '{{.Id}}', image], text=True).strip()
              container = f"mcp-build-info-{name}-{os.environ['GITHUB_RUN_ID']}"
              binary = report_dir / f'{name}-gateway-main'
              subprocess.run(['docker', 'create', '--name', container, image], check=True,
                             stdout=subprocess.DEVNULL)
              try:
                  subprocess.run(['docker', 'cp', f'{container}:/app/main', str(binary)], check=True)
              finally:
                  subprocess.run(['docker', 'rm', container], check=True, stdout=subprocess.DEVNULL)
              info = subprocess.check_output(['go', 'version', '-m', str(binary)], text=True)
              binary.unlink()
              present = set()
              for line in info.splitlines():
                  fields = line.split()
                  if len(fields) == 3 and fields[0] in ('mod', 'dep') and fields[2] == '(devel)':
                      present.add(fields[1])
              missing = required_modules - present
              assert not missing, f'{name} binary uses published/missing Bifrost modules: {sorted(missing)}'
              (report_dir / f'{name}-build-info.txt').write_text(
                  f'source={source}\nimage={image}\nimage_id={image_id}\n'
                  f'checkout_head={git("rev-parse", "HEAD")}\ntracked_status=clean\n'
                  + info)
          PY
        env:
          MATRIX_NAME: ${{ matrix.name }}
      - name: Check comparator and fixture contracts
        working-directory: driver
        run: |
          .github/workflows/scripts/test-mcp-apps-fixture.sh --self-check
          python3 -m json.tool tests/integrations/python/config.json >/dev/null
          python3 -m json.tool tests/e2e/api/collections/provider-harness.json >/dev/null
      - name: Run pinned product fixture scope
        id: candidate-fixture
        continue-on-error: true
        working-directory: driver
        env:
          GITHUB_ACTIONS: "true"
          BIFROST_STOCK_SOURCE: ${{ env.STOCK_SOURCE }}
          BIFROST_CANDIDATE_SOURCE: ${{ env.CANDIDATE_SOURCE }}
          BIFROST_STABLE_REFERENCE: ${{ env.STABLE_REFERENCE }}
          BIFROST_COMPARISON_MODE: ${{ env.COMPARISON_MODE }}
          BIFROST_FIXTURE_SCOPES: ${{ env.FIXTURE_SCOPES }}
          BIFROST_REFERENCE_HOST_DIRECTORY: ${{ matrix.reference_host == true && env.REFERENCE_HOST_DIRECTORY || '' }}
        run: .github/workflows/scripts/test-mcp-apps-fixture.sh "bifrost:candidate-${{ matrix.name }}-${{ github.run_id }}" "$REPORT_DIR"
      - name: Run pinned stock fixtures and compare observed assertions
        id: stock-fixture
        if: always() && steps.build-stock.outcome == 'success' && steps.build-candidate.outcome == 'success' && steps.candidate-fixture.outcome != 'skipped'
        working-directory: driver
        env:
          GITHUB_ACTIONS: "true"
          BIFROST_STOCK_SOURCE: ${{ env.STOCK_SOURCE }}
          BIFROST_CANDIDATE_SOURCE: ${{ env.CANDIDATE_SOURCE }}
          BIFROST_STABLE_REFERENCE: ${{ env.STABLE_REFERENCE }}
          BIFROST_COMPARISON_MODE: ${{ env.COMPARISON_MODE }}
          BIFROST_FIXTURE_SCOPES: ${{ env.FIXTURE_SCOPES }}
          BIFROST_REFERENCE_HOST_DIRECTORY: ""
        run: .github/workflows/scripts/test-mcp-apps-fixture.sh --baseline "bifrost:stock-${{ matrix.name }}-${{ github.run_id }}" "$REPORT_DIR"
      - name: Run known-red MCP Apps output schema regression probe
        if: always() && matrix.output_schema_probe == true && steps.build-candidate.outcome == 'success'
        working-directory: candidate
        env:
          REPORT_DIR: ${{ env.REPORT_DIR }}
        run: |
          set -euo pipefail
          raw_log="$RUNNER_TEMP/c-output-schema-probe.raw.log"
          module_report="$REPORT_DIR/c-output-schema-module-dirs.txt"
          list_report="$REPORT_DIR/c-output-schema-test-list.txt"
          probe_log="$REPORT_DIR/c-output-schema-known-red.log"
          status_report="$REPORT_DIR/c-output-schema-known-red-status.txt"
          test_name='TestMCPAppsPreservesSupportedOutputSchema'
          test_file='transports/bifrost-http/handlers/mcpserver_test.go'
          probe_stage='preflight'
          record_preflight_failure() {
            probe_status=$?
            printf 'stage=%s\nexit_code=%s\n' "$probe_stage" "$probe_status" > "$status_report"
            exit "$probe_status"
          }
          trap record_preflight_failure ERR

          if ! rg -q "^func ${test_name}\\(" "$test_file"; then
            printf 'stage=preflight\nerror=expected test missing from %s\n' "$test_file" > "$status_report"
            exit 2
          fi

          # This helper must run at the candidate root because its module paths are
          # relative to the repository root. It preserves the local Go workspace.
          probe_stage='workspace-setup'
          source .github/workflows/scripts/setup-go-workspace.sh
          cd transports
          probe_stage='module-resolution'
          go list -m -f '{{.Path}} {{.Dir}}' \
            github.com/maximhq/bifrost/core \
            github.com/maximhq/bifrost/framework \
            github.com/maximhq/bifrost/transports/v2 \
            github.com/maximhq/bifrost/plugins/governance > "$module_report"
          python3 - "$module_report" "$GITHUB_WORKSPACE/candidate" <<'PY'
          import sys
          from pathlib import Path

          report = Path(sys.argv[1])
          root = Path(sys.argv[2]).resolve()
          rows = [line.split(maxsplit=1) for line in report.read_text().splitlines()]
          expected = {
              'github.com/maximhq/bifrost/core',
              'github.com/maximhq/bifrost/framework',
              'github.com/maximhq/bifrost/transports/v2',
              'github.com/maximhq/bifrost/plugins/governance',
          }
          assert {row[0] for row in rows if len(row) == 2} == expected, rows
          for module, directory in rows:
              resolved = Path(directory).resolve()
              assert resolved == root or root in resolved.parents, (module, resolved, root)
          PY

          probe_stage='test-list'
          if ! go test -list "^${test_name}$" ./bifrost-http/handlers > "$RUNNER_TEMP/c-output-schema-test-list.raw.log" 2>&1; then
            python3 - "$RUNNER_TEMP/c-output-schema-test-list.raw.log" "$list_report" "$probe_log" "$status_report" <<'PY'
          import re, sys
          from pathlib import Path
          source, destination, log, status = map(Path, sys.argv[1:])
          text = source.read_text(errors='replace')
          text = text.replace('bifrost-e2e-setup-token', '<redacted>')
          text = re.sub(r'(?i)(Bearer\s+)[A-Za-z0-9._~+/-]+=*', r'\1<redacted>', text)
          text = re.sub(r'sk-bf-[A-Za-z0-9_-]+', '<redacted>', text)
          destination.write_text(text)
          log.write_text(text)
          status.write_text('stage=test-list\nexit_code=nonzero\n')
          PY
            trap - ERR
            exit 2
          fi
          python3 - "$RUNNER_TEMP/c-output-schema-test-list.raw.log" "$list_report" <<'PY'
          import re, sys
          from pathlib import Path
          source, destination = map(Path, sys.argv[1:])
          text = source.read_text(errors='replace')
          text = text.replace('bifrost-e2e-setup-token', '<redacted>')
          text = re.sub(r'(?i)(Bearer\s+)[A-Za-z0-9._~+/-]+=*', r'\1<redacted>', text)
          text = re.sub(r'sk-bf-[A-Za-z0-9_-]+', '<redacted>', text)
          destination.write_text(text)
          PY
          if ! grep -Fxq "$test_name" "$list_report"; then
            printf 'stage=test-list\nerror=Go package did not list expected test\n' > "$status_report"
            cp "$list_report" "$probe_log"
            trap - ERR
            exit 2
          fi

          probe_stage='go-test'
          trap - ERR
          set +e
          go test -v -count=1 -run "^${test_name}$" ./bifrost-http/handlers > "$raw_log" 2>&1
          probe_status=$?
          set -e
          python3 - "$raw_log" "$probe_log" "$status_report" "$probe_status" <<'PY'
          import re, sys
          from pathlib import Path
          source, destination, status = map(Path, sys.argv[1:4])
          code = sys.argv[4]
          text = source.read_text(errors='replace')
          text = text.replace('bifrost-e2e-setup-token', '<redacted>')
          text = re.sub(r'(?i)(Bearer\s+)[A-Za-z0-9._~+/-]+=*', r'\1<redacted>', text)
          text = re.sub(r'sk-bf-[A-Za-z0-9_-]+', '<redacted>', text)
          destination.write_text(text)
          status.write_text(f'stage=go-test\nexit_code={code}\ntest=TestMCPAppsPreservesSupportedOutputSchema\n')
          PY
          exit "$probe_status"
      - name: Verify integrated first-boot grants and same-store restart
        id: firstboot-candidate
        if: always() && matrix.extra_firstboot && steps.build-candidate.outcome == 'success'
        continue-on-error: true
        working-directory: driver
        env:
          BIFROST_STOCK_SOURCE: ${{ env.STOCK_SOURCE }}
          BIFROST_CANDIDATE_SOURCE: ${{ env.CANDIDATE_SOURCE }}
          BIFROST_STABLE_REFERENCE: ${{ env.STABLE_REFERENCE }}
          BIFROST_COMPARISON_MODE: strict
          BIFROST_FIXTURE_SCOPES: firstboot-grants
        run: .github/workflows/scripts/test-mcp-apps-fixture.sh "bifrost:candidate-${{ matrix.name }}-${{ github.run_id }}" "$REPORT_DIR/firstboot-grants"
      - name: Verify first-boot stock red and restart control
        if: always() && matrix.extra_firstboot && steps.build-stock.outcome == 'success' && steps.firstboot-candidate.outcome != 'skipped'
        working-directory: driver
        env:
          BIFROST_STOCK_SOURCE: ${{ env.STOCK_SOURCE }}
          BIFROST_CANDIDATE_SOURCE: ${{ env.CANDIDATE_SOURCE }}
          BIFROST_STABLE_REFERENCE: ${{ env.STABLE_REFERENCE }}
          BIFROST_COMPARISON_MODE: strict
          BIFROST_FIXTURE_SCOPES: firstboot-grants
        run: .github/workflows/scripts/test-mcp-apps-fixture.sh --baseline "bifrost:stock-${{ matrix.name }}-${{ github.run_id }}" "$REPORT_DIR/firstboot-grants"
      - name: Preserve source identity and sanitized fixture reports
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: mcp-stack-${{ matrix.name }}-${{ github.sha }}
          path: ${{ runner.temp }}/mcp-stack-${{ matrix.name }}/
          if-no-files-found: error
          retention-days: 14
      - name: Remove local qualification images
        if: always()
        run: docker image rm -f "bifrost:stock-${{ matrix.name }}-${{ github.run_id }}" "bifrost:candidate-${{ matrix.name }}-${{ github.run_id }}" >/dev/null 2>&1 || true
